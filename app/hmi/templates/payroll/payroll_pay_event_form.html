{% extends "base.html" %}

{% block title %}{% if event %}Edit{% else %}New{% endif %} Pay Event — Payroll{% endblock %}

{% block content %}
<div class="card">
    <h2>{% if event %}Edit Pay Event{% else %}New Pay Event{% endif %}</h2>

    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-row" style="display: flex; gap: 1rem; flex-wrap: wrap;">
            <div class="form-group" style="flex: 1; min-width: 280px;">
                <label for="employee_id">Employee *</label>
                <select id="employee_id" name="employee_id" required {% if event %}disabled{% endif %}>
                    <option value="">— select —</option>
                    {% for e in employees %}
                    <option value="{{ e.id }}"
                            {% if (event and event.employee_id == e.id) or (employee and employee.id == e.id) %}selected{% endif %}>
                        {{ e.preferred_name or e.legal_name }} ({{ e.position or 'no position' }})
                    </option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group" style="flex: 1; min-width: 180px;">
                <label for="payment_date">Payment Date *</label>
                <input type="date" id="payment_date" name="payment_date" required
                       value="{{ event.payment_date.isoformat() if event else '' }}">
            </div>
            <div class="form-group" style="flex: 1; min-width: 180px;">
                <label for="bank_reference">Bank Reference</label>
                <input type="text" id="bank_reference" name="bank_reference"
                       value="{{ event.bank_reference if event else '' }}"
                       placeholder="e.g. H9123456789">
            </div>
        </div>

        <div class="form-row" style="display: flex; gap: 1rem; flex-wrap: wrap;">
            <div class="form-group" style="flex: 1; min-width: 200px;">
                <label for="pay_period_start">Period Start *</label>
                <input type="date" id="pay_period_start" name="pay_period_start" required
                       value="{{ event.pay_period_start.isoformat() if event else '' }}">
            </div>
            <div class="form-group" style="flex: 1; min-width: 200px;">
                <label for="pay_period_end">Period End *</label>
                <input type="date" id="pay_period_end" name="pay_period_end" required
                       value="{{ event.pay_period_end.isoformat() if event else '' }}">
            </div>
        </div>

        <div class="form-row" style="display: flex; gap: 1rem; flex-wrap: wrap;">
            <div class="form-group" style="flex: 1; min-width: 180px;">
                <label for="gross_amount">Gross *</label>
                <input type="number" step="0.01" id="gross_amount" name="gross_amount" required
                       value="{{ "%.2f"|format(event.gross_amount) if event else '' }}">
            </div>
            <div class="form-group" style="flex: 1; min-width: 180px;">
                <label for="payg_tax_amount">PAYG Withheld *</label>
                <input type="number" step="0.01" id="payg_tax_amount" name="payg_tax_amount" required
                       value="{{ "%.2f"|format(event.payg_tax_amount) if event else '' }}">
            </div>
            <div class="form-group" style="flex: 1; min-width: 180px;">
                <label for="net_amount">Net *</label>
                <input type="number" step="0.01" id="net_amount" name="net_amount" required
                       value="{{ "%.2f"|format(event.net_amount) if event else '' }}">
            </div>
            <div class="form-group" style="flex: 1; min-width: 180px;">
                <label for="super_ote_amount">Super OTE</label>
                <input type="number" step="0.01" id="super_ote_amount" name="super_ote_amount"
                       value="{{ "%.2f"|format(event.super_ote_amount) if event else '' }}">
                <small style="color:#7f8c8d;">Defaults to gross if blank</small>
            </div>
        </div>

        <div class="form-group">
            <label for="notes">Notes</label>
            <textarea id="notes" name="notes" rows="2">{{ event.notes if event else '' }}</textarea>
        </div>

        <div style="margin-top: 1rem;">
            <button type="submit" class="btn btn-primary">{% if event %}Update{% else %}Create Draft{% endif %}</button>
            <a href="{{ url_for('payroll_hmi.payroll_pay_event_detail', pay_event_id=event.id) if event else url_for('payroll_hmi.payroll_pay_events_list') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>

<p><a href="{{ url_for('payroll_hmi.payroll_pay_events_list') }}" class="btn btn-secondary">← All pay events</a></p>
{% endblock %}
