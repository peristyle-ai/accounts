name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secret-scan:
    # GitHub's own secret scanning and push protection are free on a PUBLIC
    # repository. This job is the SYNCHRONOUS gate: it fails the build the
    # moment a secret is committed. GitHub's own scanning is asynchronous --
    # an alert arrives minutes after the push -- so this is the one that
    # actually stops it.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, not a shallow clone: a secret that was
          # committed and then deleted is still in the history, and
          # deleting the file does not un-leak it.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: no secret was committed
        run: python scripts/check_no_secrets.py

  pytest:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: accounts_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/accounts_test
      # init_db.py reads DATABASE_URL; the app itself builds its DSN from
      # the DB_* vars, so BOTH are needed or the app connects with no password.
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: accounts_test
      DB_USER: postgres
      DB_PASSWORD: password
      SECRET_KEY: ci-not-a-real-secret
      ACCOUNTS_TEST_PASSWORD: not-a-real-password

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: install the dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: the schema
        # --mode=standalone installs the tables into `public`, which is what a
        # fresh checkout gets and needs no extra steps. (--mode=schema is the
        # per-install path: it expects the SHARED auth table public.users to
        # already exist, which a CI database does not have.)
        run: |
          set -euo pipefail
          # The app refuses to import unless PAYROLL_PII_KEY is a VALID
          # Fernet key, so generate one per run rather than hardcoding a key
          # in the repository.
          echo "PAYROLL_PII_KEY=$(python3 -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" >> "$GITHUB_ENV"
          python3 init_db.py --mode=standalone

      - name: the tests
        run: pytest -q
